name: Архив релиза

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Проверить версию и собрать архив
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/build_release.py --tag "$RELEASE_TAG"
      - name: Прикрепить архив
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/rp5_weather.zip --repo "$GITHUB_REPOSITORY"
